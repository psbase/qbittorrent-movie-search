name: Windows package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the offline checks
        shell: pwsh
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: MovieSearch-Windows
          path: out/MovieSearch-Windows.zip
          if-no-files-found: error
